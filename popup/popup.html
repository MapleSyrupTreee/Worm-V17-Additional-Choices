<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worm V17 Additional Choices</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="pop">

    <!-- Header -->
    <header class="pop-header">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="" class="logo">
        <div class="brand-text">
          <h1>Worm V17 CYOA <span class="status-indicator" id="statusIndicator" title="Checking CYOA tab…"></span></h1>
          <p class="tagline">Additional Choices</p>
        </div>
      </div>
      <span class="version-pill">v0.2.2</span>
    </header>

    <!-- Primary action -->
    <section class="pop-section">
      <button id="openInPageModalBtn" class="btn-primary" title="Opens the Add Choice modal on the CYOA tab">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
        Add Choice
      </button>
    </section>

    <!-- Custom choices -->
    <section class="pop-section">
      <div class="section-head">
        <h2 class="section-title">Custom Choices <span class="count-pill" id="customChoicesCount">0</span></h2>
        <div class="io-actions">
          <button id="exportBtn" class="btn-ghost" title="Export as JSON">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8m0 0 3-3M8 10 5 7M3 13h10"/></svg>
            Export
          </button>
          <button id="importBtn" class="btn-ghost" title="Import from JSON">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V2m0 0L5 5m3-3 3 3M3 13h10"/></svg>
            Import
          </button>
          <input type="file" id="importFileInput" accept=".json" hidden>
        </div>
      </div>
      <div id="choicesList" class="choices-list">
        <div class="empty-state">No custom choices yet — click “Add Choice” to create one.</div>
      </div>
    </section>

    <footer class="pop-footer">
      Target <code>ltouroumov.ch</code> · <code>cyoa-editor</code>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
